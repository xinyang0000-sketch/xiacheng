<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eceae5">
<title>夏澄｜澎湖玩法與行程</title>
<meta name="description" content="住在澎湖海邊的清水模民宿夏澄。選日期和人數，自動排好跳島、玩水、夜釣、看夕陽的每日行程與地圖。">
<meta property="og:type" content="website">
<meta property="og:title" content="夏澄｜住在海邊，行程也幫你排好">
<meta property="og:description" content="澎湖跳島、玩水、夜釣、看夕陽。選日期人數，自動排好每天的路線和花費，送給民宿確認，不用先付錢。">
<meta property="og:image" content="https://xinyang0000-sketch.github.io/xiacheng/site/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* A 清水模極簡：混凝土灰底、墨黑文字、海藍點綴；明體標題＋黑體內文 */
:root{
  --bg:#eceae5; --surface:#f7f6f3; --card:#ffffff; --ink:#1e1f1f; --muted:#55595a; --line:#cfcbc2; --line2:#e2dfd8;
  --accent:#1f5f73; --accent-soft:#e3eef1; --warn-bg:#fff4dc; --warn:#6b4e0f; --ok:#1f6a45; --ok-bg:#e2f0e7; --bad:#8a3b26; --bad-bg:#f8e3dc;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:84px;scroll-padding-bottom:170px;-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--serif)}
.demo{background:var(--warn-bg);color:var(--warn);font-size:14px;text-align:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}

/* header */
header.site{position:sticky;top:0;z-index:30;background:rgba(236,234,229,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.logo{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.16em;text-decoration:none;color:var(--ink)}
nav.top{display:flex;gap:6px}
nav.top a{text-decoration:none;color:var(--ink);padding:10px 16px;font-size:16px;border-bottom:2px solid transparent}
nav.top a.on{border-bottom-color:var(--ink);font-weight:700}
.line-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--ink);text-decoration:none;color:var(--ink);font-size:15px;background:transparent}
@media (max-width:899px){nav.top,header.site .line-btn{display:none} header.site .wrap{height:58px}}

/* bottom tabs (phone) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:12.5px;text-decoration:none;color:var(--muted);min-height:58px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--ink);font-weight:700}
@media (min-width:900px){nav.tabs{display:none}}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{padding-bottom:40px}}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,4.6vw,50px)}
h2{font-size:clamp(24px,2.6vw,30px)}
h3{font-size:20px}

.lead{color:var(--muted);font-size:17.5px;margin:0}
.sec{padding-top:56px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.more{font-size:16px;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:3px;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border:1px solid var(--ink);background:var(--ink);color:#f7f6f3;text-decoration:none;font-size:17px;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;letter-spacing:0}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:28px;padding-top:28px}
.hero .photo{position:relative;aspect-ratio:3/2;background:#c6c2b9 center/cover no-repeat;max-width:100%}
.tag-demo{position:absolute;left:12px;bottom:12px;background:rgba(247,246,243,.92);font-size:12.5px;padding:3px 10px}
.hero .txt{display:flex;flex-direction:column;gap:18px;justify-content:center}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:48px;padding-top:56px}.hero .photo{order:2}}
.quick{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.quick label{display:flex;flex-direction:column;padding:12px 14px 12px 0;font-size:13px;color:var(--muted);gap:2px;min-width:0}
.quick label+label{border-left:1px solid var(--line);padding-left:14px}
.quick input,.quick select{border:0;background:transparent;font-size:16px;font-weight:500;color:var(--ink);padding:2px 0;width:100%;min-width:0}

/* cards / lists */
.list{display:flex;flex-direction:column;background:transparent}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.item .th{width:96px;height:96px;background:#c9c5bc center/cover no-repeat}
.item b{font-size:18px;display:block}
.item .meta{font-size:14.5px;color:var(--muted)}
.price{font-size:16px;font-weight:700;white-space:nowrap}
.price small{display:block;font-size:12px;color:var(--muted);font-weight:400;text-align:right}
@media (min-width:900px){.list.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border:1px solid var(--line);background:var(--surface);font-size:15.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#f7f6f3;border-color:var(--ink)}
.panel{background:var(--surface);padding:24px}
.box{background:var(--card);padding:20px;border:1px solid var(--line2)}
.grid3{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}}
.stay{display:grid;grid-template-columns:1fr;background:var(--surface)}
.stay .pic{aspect-ratio:16/10;background:#b1aea6 center/cover no-repeat}
.stay .in{padding:26px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.stay{grid-template-columns:1fr 1fr}.stay .pic{aspect-ratio:auto;min-height:320px}.stay .in{padding:44px}}
.links{display:flex;flex-wrap:wrap;gap:10px}
.weather{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:900px){.weather{grid-template-columns:repeat(4,minmax(0,1fr))}}
.weather .box b{display:block;font-size:20px}
.weather .box span{font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px}
.pill.wait{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}

/* planner */
.planner{display:grid;grid-template-columns:1fr;gap:24px;padding-top:28px}
@media (min-width:980px){.planner{grid-template-columns:330px minmax(0,1fr) 300px;align-items:start}.sticky{position:sticky;top:88px}}
.form{display:flex;flex-direction:column;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.form input,.form select,.form textarea{height:48px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:16px;color:var(--ink)}
.form textarea{height:96px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.days button{min-height:46px;padding:0 18px;border:1px solid var(--line);background:transparent;font-size:15.5px}
.days button[aria-pressed="true"]{background:var(--ink);color:#f7f6f3;border-color:var(--ink)}
.tl{background:var(--surface);padding:20px 22px}
.tl-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px}
.tl-row .t{font-weight:700;font-size:15.5px;padding-top:1px}
.tl-row .c{border-left:2px solid var(--ink);padding:0 0 22px 18px;position:relative}
.tl-row .c.paid{border-left-color:var(--accent)}
.tl-row:last-child .c{padding-bottom:4px}
.tl-row b{font-size:17px;display:block}
.tl-row .meta{font-size:14px;color:var(--muted)}
.tl-row .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sum{background:var(--ink);color:#f7f6f3;padding:22px;display:flex;flex-direction:column;gap:12px}
.sum .big{font-size:30px;font-weight:700}
.sum .sm{font-size:14px;color:#d9d6cf}
.sum .btn{background:#f7f6f3;color:var(--ink);border-color:#f7f6f3}
.sum .btn.ghost{background:transparent;color:#f7f6f3;border-color:#8c8a85}
.empty{border:1px dashed var(--line);padding:22px;color:var(--muted);text-align:center}

/* detail */
.detail{display:grid;grid-template-columns:1fr;gap:28px;padding-top:24px}
@media (min-width:980px){.detail{grid-template-columns:minmax(0,1fr) 400px;align-items:start}}
.dphoto{aspect-ratio:16/9;background:#c9c5bc center/cover no-repeat;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{border:1px solid var(--line);padding:4px 12px;font-size:14.5px;background:var(--surface)}
.dates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dates button{min-height:62px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted);line-height:1.3}
.dates button b{display:block;font-size:17px;color:var(--ink)}
.dates button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#d9d6cf}
.dates button[aria-pressed="true"] b{color:#fff}
.slots{display:flex;gap:8px}
.slots button{flex:1;min-height:50px;border:1px solid var(--line);background:#fff;font-size:15.5px}
.slots button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:8px 12px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1}
.stepper b{font-size:18px}

/* tables (admin) */
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:15.5px}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.tbl th{background:var(--surface);font-weight:700;font-size:14px;color:var(--muted)}
.scroll{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:15px}
.bar i{display:block;height:14px;background:var(--accent)}

footer{margin-top:64px;border-top:1px solid var(--line);padding:28px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(30,31,31,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;font-size:15px;z-index:60;white-space:nowrap}
@media (min-width:900px){.toast{bottom:32px}}
.note{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* pax stepper */
.pax{display:flex;flex-direction:column;border:1px solid var(--line);background:#fff}
.pax .pr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.pax .pr:last-child{border-bottom:0}
.pax .pr b{font-size:16px;color:var(--ink);display:block}
.pax .pr small{font-size:13px;color:var(--muted)}
.pax .ctl{display:flex;align-items:center;gap:12px}
.pax .ctl button{width:40px;height:40px;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1;color:var(--ink)}
.pax .ctl button:disabled{opacity:.35;cursor:default}
.pax .ctl span{min-width:20px;text-align:center;font-weight:700;font-size:17px;color:var(--ink)}
.paxbtn{height:48px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:16px;text-align:left;color:var(--ink);width:100%}
/* timeline cards */
.hint svg{width:20px;height:20px;flex:none}
.hint{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--accent);background:var(--accent-soft);padding:10px 14px;margin-bottom:14px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:10px;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .th{width:64px;height:64px;background:#c9c5bc center/cover no-repeat}
.card b{font-size:16.5px;display:block}
.card .meta{display:block}
.card .swapcue{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--accent);padding:0 4px}
.card .swapcue svg{width:22px;height:22px}
.freecard{padding:4px 0 2px}
.where{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--muted);margin-top:2px}
.where svg{width:14px;height:14px;flex:none}
.move{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);padding:2px 0 14px}
.move.late{color:var(--warn);font-weight:700}
.warn{display:inline-block;font-size:12.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 8px;margin-top:4px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.map{height:260px;background:#dfe6e8;border:1px solid var(--line);margin-bottom:14px;z-index:0}
@media (min-width:900px){.map{height:320px}}
.map .pin{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.map .pin.home{background:var(--accent)}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.alt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);padding:8px;color:var(--ink);width:100%}
.alt:hover{border-color:var(--accent)}
.alt .th{width:56px;height:56px;background:#c9c5bc center/cover no-repeat}
.alt b{display:block;font-size:16px}
@media (max-width:600px){.tl{padding:16px 14px}.tl-row{grid-template-columns:44px minmax(0,1fr);gap:8px}.tl-row .t{font-size:14.5px}.tl-row .c{padding-left:12px}
.card{grid-template-columns:52px minmax(0,1fr) 28px;gap:10px;padding:8px}.card .th{width:52px;height:52px}.card .swapcue{padding:0}}
details.cfg>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;min-height:44px}
details.cfg>summary::-webkit-details-marker{display:none}
details.cfg>summary .note{font-weight:400}
details.cfg>summary::after{content:"修改";font-size:14px;color:var(--accent);border:1px solid var(--accent);padding:4px 12px;flex:none}
details.cfg[open]>summary::after{content:"收起"}
@media (min-width:980px){details.cfg>summary{pointer-events:none}details.cfg>summary::after{display:none}}
.sheet-top{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.sheet-top .th{width:72px;height:72px;background:#c9c5bc center/cover no-repeat}
/* ===== v3：引導式排行程 ===== */
::selection{background:#cfe2e7;color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:22px 0 26px}
.steps button{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--muted);font-size:15px;line-height:1.3}
.steps button i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-weight:700;font-size:15px}
.steps button.done[aria-current="step"],.steps button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.steps button.done{color:var(--ink)}
.steps button:disabled{cursor:default;opacity:.6}
@media (max-width:600px){.steps button{flex-direction:column;justify-content:center;text-align:center;gap:4px;font-size:13.5px;padding:8px 4px}}
.stage{background:var(--card);border:1px solid var(--line2);padding:28px;max-width:760px}
@media (max-width:600px){.stage{padding:20px 16px}}
.stage h2{margin-bottom:6px}
.field{margin-top:24px}
.field>.lab{display:block;font-size:16px;font-weight:700;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg button{min-height:52px;border:1px solid var(--line);background:#fff;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.dateinput{height:54px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:17px;width:100%;max-width:320px}
.next{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:#fff;border:2px solid var(--line2);padding:0;color:var(--ink);overflow:hidden}
.tile .ph{aspect-ratio:4/3;background:#c9c5bc center/cover no-repeat}
.tile .tx{padding:12px 14px 14px}
.tile b{font-size:18px;display:block}
.tile small{font-size:14px;color:var(--muted);display:block;line-height:1.5}
.tile .ck{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);border:2px solid var(--line);display:grid;place-items:center}
.tile .ck svg{width:20px;height:20px;opacity:0}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 6px 18px rgba(31,95,115,.18)}
.tile[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.tile[aria-pressed="true"] .ck svg{opacity:1}
.trip{display:grid;grid-template-columns:1fr;gap:24px}

/* 距離與交通時間（直線距離 × 1.35，時速 35 公里，加 5 分鐘停車，皆為估算） */
function km(a,b){const R=6371,t=Math.PI/180,dLa=(b[0]-a[0])*t,dLo=(b[1]-a[1])*t,h=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function travel(pa,pb){if(!pa||!pb||pa===pb)return 0;return Math.round(km(PLACES[pa].ll,PLACES[pb].ll)*1.35/35*60)+5}

function retime(d){const its=dayItems(d);for(let i=1;i<its.length;i++){const p=its[i-1],it=its[i],e=toMin(p.time)+durOf(p)+travel(placeOf(p),placeOf(it));if(toMin(it.time)<e){it.time=fromMin(e)}}}

const dayTravel=d=>{const its=dayItems(d);let t=0;for(let i=1;i<its.length;i++)t+=travel(placeOf(its[i-1]),placeOf(its[i]));return t};
/* 幫我排最順：固定的（抵達、夕陽、晚餐、夜釣、跳島、退房）不動，中間的行程依距離重排 */
const ANCHOR=it=>it.free&&it.free!=="market"||["squid","seafood","bbq","fireworks","scooter","car","transfer","south","north","qimei"].includes(it.id);
function optimize(d){const its=dayItems(d),before=dayTravel(d);let i=0;
  while(i<its.length){if(ANCHOR(its[i])){i++;continue}let j=i;while(j<its.length&&!ANCHOR(its[j]))j++;
    const seg=its.slice(i,j),start=toMin(seg[0].time);let cur=i>0?placeOf(its[i-1]):"home",order=[],left=seg.slice();
    while(left.length){left.sort((a,b)=>travel(cur,placeOf(a))-travel(cur,placeOf(b)));const n=left.shift();order.push(n);cur=placeOf(n)}
    let t=i>0?Math.max(start,toMin(its[i-1].time)+durOf(its[i-1])+travel(placeOf(its[i-1]),placeOf(order[0]))):start;
    order.forEach((it,k)=>{if(k>0)t=Math.max(t,toMin(order[k-1].time)+durOf(order[k-1])+travel(placeOf(order[k-1]),placeOf(it)));it.time=fromMin(t)});i=j}
  retime(d);plan.items.sort((x,y)=>x.day-y.day||x.time.localeCompare(y.time));return before-dayTravel(d)}

function available(id,m){const a=A(id);return a&&!a.off&&a.months.includes(m)}
function generate(p){
  const m=monthOf(p.start),want=p.interests.length?p.interests:["輕鬆"],used=new Set(),items=[];
  const x=p.pax,young=x.child+x.infant>0,soft=x.senior+x.infant>0;
  const pick=(pool)=>{for(const id of pool){if(!used.has(id)&&available(id,m)&&!(soft&&INTENSE.includes(id))&&!(x.infant&&MINAGE[id])){used.add(id);return id}}return null};
  const byTag=t=>ACTS.filter(a=>(a.tags||[]).includes(t)).map(a=>a.id);
  const pref=(order,mx=99)=>{const f=l=>l.filter(id=>(A(id).dur||0)<=mx);for(const t of order){if(want.includes(t)){const id=pick(f(byTag(t)));if(id)return id}}return pick(f(byTag("輕鬆").concat(byTag("導覽"))))};
  const add=(day,time,o)=>items.push(Object.assign({day,time,uid:Math.random().toString(36).slice(2,9)},o));
  for(let d=0;d<p.days;d++){
    const first=d===0,last=d===p.days-1&&p.days>1;
    if(first){add(d,"10:30",{free:"arrive"});add(d,"11:30",{id:young||x.senior||heads(x)>4?"car":"scooter"});used.add("scooter");used.add("car");
      const a=pref(["玩水","輕鬆","導覽","美食"],3);if(a)add(d,"14:00",{id:a});
      add(d,"17:30",{free:"sunset"});
      if(want.includes("美食")&&pick(["seafood"]))add(d,"19:00",{id:"seafood"});else add(d,"19:00",{free:"dinner"});
      if(p.days>1&&(want.includes("美食")||want.includes("玩水"))&&!young&&pick(["squid"]))add(d,"20:30",{id:"squid"});
    }else if(last){
      const a=pick(["tidal","weir","bluecave","basalt"]);if(a)add(d,"08:30",{id:a});
      add(d,"11:00",{free:"checkout"});add(d,"12:00",{free:"market"});

      add(d,"14:30",{free:"leave"});
    }else{
      const isl=want.includes("跳島")?pick(["south","qimei","north","east"]):null;
      if(isl){add(d,"08:00",{id:isl});}
      else{const a=pref(["導覽","輕鬆","美食"],3);if(a)add(d,"09:00",{id:a});const b=pref(["玩水","輕鬆","導覽"],3);if(b)add(d,"14:00",{id:b});}
      if(!isl){const last=items.filter(x=>x.day===d).at(-1),from=last?(last.id?AT[last.id]:FREE[last.free].at):"home";
        const pool=ACTS.filter(a=>a.free&&!a.off&&!a.isl&&!used.has(a.id)&&a.dur<=1.5).sort((x,y)=>travel(from,AT[x.id])-travel(from,AT[y.id]));
        if(want.includes("輕鬆"))pool.sort((x,y)=>((y.tags||[]).includes("輕鬆")-(x.tags||[]).includes("輕鬆"))||travel(from,AT[x.id])-travel(from,AT[y.id]));

  FAV.forEach(id=>{const a=A(id);if(!a||a.off||a.isl||used.has(id)||!a.months.includes(m)||(x.infant&&MINAGE[id])||(soft&&INTENSE.includes(id)))return;
    let best=0,bc=1e9;for(let d=0;d<p.days;d++){const c=items.filter(t=>t.day===d&&t.id&&!A(t.id).free&&A(t.id).dur>=1).length+(d===p.days-1&&p.days>1?2:0);if(c<bc){bc=c;best=d}}
    used.add(id);add(best,a.dur>=4?"09:00":"15:30",{id})});
  p.items=items.sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));const keep=plan;plan=p;retimeAll();plan=keep;return p;
}

function stepText(st){const m=st.maneuver,road=st.name?`進入${st.name}`:"",mod=MOD[m.modifier]||"";
  if(m.type==="depart")return `出發，往${mod||"前"}${st.name?"沿"+st.name:""}`.replace("往直走","直走");
  if(m.type==="arrive")return "抵達目的地";
  if(m.type==="roundabout"||m.type==="rotary")return `進入圓環，第 ${m.exit||1} 個出口出去${st.name?"，接"+st.name:""}`;
  if(m.type==="new name"||m.type==="continue")return `繼續直走${road?"，"+road:""}`;
  if(m.type==="merge")return `匯入${st.name||"道路"}`;
  if(m.type==="fork")return `${mod.includes("左")?"靠左":"靠右"}走${road?"，"+road:""}`;
  return `${mod||"轉彎"}${road?"，"+road:""}`}
const fmtDist=d=>d>=1000?(d/1000).toFixed(1)+" 公里":Math.max(10,Math.round(d/10)*10)+" 公尺";
function say(t){try{if(!DRV.voice||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";u.rate=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function distM(a,b){return km(a,b)*1000}
function segDist(p,a,b){const x=(b[1]-a[1])*Math.cos(p[0]*Math.PI/180),y=b[0]-a[0],px=(p[1]-a[1])*Math.cos(p[0]*Math.PI/180),py=p[0]-a[0],t=Math.max(0,Math.min(1,(px*x+py*y)/(x*x+y*y||1)));return distM(p,[a[0]+t*y,a[1]+t*(b[1]-a[1])])}
function offRoute(p,geo){let m=1e9;for(let i=1;i<geo.length;i++){m=Math.min(m,segDist(p,geo[i-1],geo[i]));if(m<40)return 0}return m}
async function drvRoute(from){const to=DRV.dest.ll;const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from[1].toFixed(5)},${from[0].toFixed(5)};${to[1].toFixed(5)},${to[0].toFixed(5)}?overview=full&geometries=geojson&steps=true`);const j=await r.json();if(j.code!=="Ok")throw 0;
  const rt=j.routes[0];DRV.geo=rt.geometry.coordinates.map(c=>[c[1],c[0]]);DRV.steps=rt.legs[0].steps.map(st=>({txt:stepText(st),ll:[st.maneuver.location[1],st.maneuver.location[0]],d:st.distance}));DRV.si=1;DRV.said={};DRV.total=rt.distance;DRV.time=rt.duration;
  if(DRV.line)DRV.line.remove();DRV.line=L.polyline(DRV.geo,{color:"#a2461f",weight:7,opacity:.9}).addTo(DRV.map);DRV.lastRoute=Date.now()}
function drvUpdate(p){if(!DRV.on)return;DRV.me=p;if(DRV.mk)DRV.mk.setLatLng(p);else DRV.mk=L.circleMarker(p,{radius:10,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(DRV.map);
  DRV.map.setView(p,Math.max(DRV.map.getZoom(),16),{animate:true});
  if(!DRV.steps){drvRoute(p).then(()=>drvUpdate(p)).catch(()=>drvMsg("路線讀不到，請改用 Google 地圖"));return}
  const left=distM(p,DRV.dest.ll);if(left<40){drvMsg("已抵達 "+DRV.dest.name,"");say("已抵達"+DRV.dest.name);return}
  if(offRoute(p,DRV.geo)>80&&Date.now()-DRV.lastRoute>15000){drvMsg("重新規劃路線…");say("重新規劃路線");drvRoute(p).then(()=>drvUpdate(p)).catch(()=>{});return}
  while(DRV.si<DRV.steps.length-1&&distM(p,DRV.steps[DRV.si].ll)<25)DRV.si++;
  const st=DRV.steps[DRV.si],d=distM(p,st.ll);
  if(d<200&&!DRV.said[DRV.si+"n"]){DRV.said[DRV.si+"n"]=1;say(`${fmtDist(d)}後，${st.txt}`)}else if(!DRV.said[DRV.si+"f"]&&d>=200){DRV.said[DRV.si+"f"]=1;if(DRV.si===1)say(DRV.steps[0].txt)}
  drvMsg(st.txt,fmtDist(d)+"後");document.getElementById("drv-left").textContent=`剩下約 ${fmtDist(left*1.25)}・${Math.max(1,Math.round(left*1.25/1000/35*60))} 分鐘`}

async function startDrive(ll,name){if(!navigator.geolocation){toast("這台裝置不能定位，請改用 Google 地圖");return}
  Object.assign(DRV,{on:true,dest:{ll,name},steps:null,geo:null,line:null,mk:null,voice:true});
  const ov=document.createElement("div");ov.className="drive";ov.id="drive";ov.innerHTML=`<div class="drv-top"><span id="drv-pre">定位中</span><b id="drv-step">正在找你的位置…</b></div><div id="drv-map"></div>
   <div class="drv-bot"><div><b class="notranslate">${esc(name)}</b><span id="drv-left">計算中</span></div><div class="drv-btns"><button type="button" class="btn small ghost" id="drv-voice">語音：開</button><a class="btn small ghost" target="_blank" rel="noopener" href="${gDir(ll)}">Google 地圖</a><button type="button" class="btn small" id="drv-end">結束</button></div><p class="drv-warn">開車請專心看路，語音會提醒轉彎。螢幕要保持開著。</p></div>`;
  document.body.appendChild(ov);document.body.classList.add("driving");
  DRV.map=L.map("drv-map",{zoomControl:false,attributionControl:true}).setView(ll,13);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(DRV.map);
  L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="pin home">終</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(DRV.map);
  document.getElementById("drv-end").onclick=stopDrive;document.getElementById("drv-voice").onclick=e=>{DRV.voice=!DRV.voice;e.target.textContent="語音："+(DRV.voice?"開":"關");if(!DRV.voice&&window.speechSynthesis)speechSynthesis.cancel()};
  try{if(navigator.wakeLock)DRV.lock=await navigator.wakeLock.request("screen")}catch(e){}
  say("開始導航，前往"+name);
  DRV.watch=navigator.geolocation.watchPosition(pos=>drvUpdate([pos.coords.latitude,pos.coords.longitude]),()=>{drvMsg("沒有定位權限，請在瀏覽器允許定位，或改用 Google 地圖")},{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}
function stopDrive(){DRV.on=false;if(DRV.watch!=null)navigator.geolocation.clearWatch(DRV.watch);try{DRV.lock&&DRV.lock.release()}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();if(DRV.map)DRV.map.remove();const o=document.getElementById("drive");if(o)o.remove();document.body.classList.remove("driving")}

const LLof=k=>PLACES[k]?PLACES[k].ll:null;
const gDir=ll=>`https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}`;
const gPark=ll=>`https://www.google.com/maps/search/%E5%81%9C%E8%BB%8A%E5%A0%B4/@${ll[0]},${ll[1]},16z`;
const shortCost=a=>a.free?costText(a):money(a.price)+(a.price!=null?" / "+a.unit:"");
const minsLL=(a,b)=>Math.round(km(a,b)*1.35/35*60)+5;
function nearby(ll,skip,n){return LIVE().filter(a=>!a.isl&&a.id!==skip&&AT[a.id]&&LLof(AT[a.id])&&!["scooter","car","transfer","bbq","souvenir","fireworks"].includes(a.id)).map(a=>({a,m:minsLL(ll,LLof(AT[a.id]))})).sort((x,y)=>x.m-y.m).filter((x,i,arr)=>arr.findIndex(z=>AT[z.a.id]===AT[x.a.id])===i).slice(0,n)}
function moveItem(uid,dir){const it=plan.items.find(x=>x.uid===uid);if(!it)return false;const its=dayItems(it.day),i=its.indexOf(it),j=i+dir;if(j<0||j>=its.length)return false;const o=its[j];[it.time,o.time]=[o.time,it.time];
  const lo=toMin((i<j?it:o).time);if(toMin((i<j?o:it).time)<lo)(i<j?o:it).time=fromMin(lo);retime(it.day);plan.items.sort((x,y)=>x.day-y.day||x.time.localeCompare(y.time));return true}

function drawBig(el){if(!el||!window.L)return;const m=L.map(el,{scrollWheelZoom:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
  const c=ui.mcat||"全部",seen=new Set(),pts=[];
  LIVE().forEach(a=>{if(a.isl)return;const k=AT[a.id],ll=LLof(k);if(!ll||k==="home")return;const paid=!a.free;if(c==="付費行程"?!paid:c!=="全部"&&a.cat!==c)return;if(seen.has(k+a.id))return;seen.add(k+a.id);pts.push(ll);
    L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:CATCOLOR[a.cat]||"#a2461f",fillOpacity:1}).addTo(m).bindPopup(`<b style="font-size:15px">${esc(a.name)}</b><br><span style="color:#6f5d4e">${esc(a.cat)}・${costText(a)}</span><br><a href="#/tour/${a.id}">看介紹</a>　<a href="javascript:void(0)" data-act="drive" data-lat="${ll[0]}" data-lng="${ll[1]}" data-name="${esc(a.name)}">導航</a>　<a target="_blank" rel="noopener" href="${gPark(ll)}">附近停車</a>`)});
  L.marker(PLACES.home.ll,{icon:L.divIcon({className:"",html:'<div class="pin home">宿</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(m).bindTooltip("夏澄");
  if(ui.me){L.circleMarker(ui.me,{radius:9,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(m).bindTooltip("你在這裡",{permanent:true,direction:"top"});}
  const me=ui.me&&km(ui.me,PLACES.home.ll)<60;if(me)m.setView(ui.me,13);else if(pts.length)m.fitBounds(pts.concat([PLACES.home.ll]),{padding:[20,20]});else m.setView(PLACES.home.ll,11)}

async function refreshMine(){const list=reqs.filter(r=>r.code);let ch=false;for(const r of list){try{const o=await rpc("xc_get",{p_code:r.code});if(o&&(o.status!==r.status||(o.owner_note||"")!==(r.owner_note||""))){r.status=o.status;r.owner_note=o.owner_note||"";ch=true}}catch(e){}}if(ch){save();if(location.hash.startsWith("#/mine"))render()}}

function track(s){const st=["已送出","民宿確認","付款","出發"],cur=s==="已確認"?2:s==="取消"?-1:1;

function pagePrivacy(){return `<div class="wrap" style="max-width:820px"><div style="padding-top:28px"><h1 style="font-size:clamp(28px,3.6vw,40px)">隱私權與服務說明</h1><p class="lead">最後更新：2026 年 11 月。正式上線前請民宿主人確認內容。</p></div>

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,v=b.dataset.v;
  if(act==="quickgo"){const px=Object.assign({},ui.qpax||(plan?plan.pax:defPax()));plan=generate({start:document.getElementById("q-start").value||nextSat(),days:+document.getElementById("q-days").value,pax:px,interests:plan?plan.interests:["玩水","美食"]});plan.made=false;ui.step=2;ui.day=0;ui.qpax=null;save();location.hash="#/plan";return}

    if(sc==="q"){openPax();return}if(sc==="p")save();render();return}
  if(act==="item"){openItem(v);return}
  if(act==="fav"){FAV=isFav(v)?FAV.filter(x=>x!==v):[...FAV,v];LS.set("xc-fav",FAV);render();toast(isFav(v)?"已收藏，排行程時會優先放進去":"已取消收藏");return}
  if(act==="follow"){toggleFollow();return}
  if(act==="drive"){e.preventDefault();startDrive([+b.dataset.lat,+b.dataset.lng],b.dataset.name||"目的地");return}
  if(act==="rainy"){const n=rainPlan(ui.day);save();render();toast(n?`已把 ${n} 個海上行程換成室內或老街`:"這天沒有需要換的海上行程");return}
  if(act==="ics"){downloadICS();return}
  if(act==="print"){document.body.classList.add("printing");setTimeout(()=>window.print(),300);return}
  if(act==="mv"){if(moveItem(v,+b.dataset.d)){save();render();toast(+b.dataset.d<0?"已往前移，時間自動調整":"已往後移，時間自動調整")}return}
  if(act==="mcat"){ui.mcat=v;render();return}
  if(act==="locate"){if(!navigator.geolocation){toast("這台裝置不能定位");return}toast("定位中…");navigator.geolocation.getCurrentPosition(p=>{ui.me=[p.coords.latitude,p.coords.longitude];render();toast(km(ui.me,PLACES.home.ll)<60?"已找到你的位置":"你目前不在澎湖")},()=>toast("沒有定位權限，請在瀏覽器允許定位"),{enableHighAccuracy:true,timeout:10000});return}
  if(act==="flt"){ui.flt=ui.flt.includes(v)?ui.flt.filter(x=>x!==v):[...ui.flt,v];render();return}
  if(act==="lookup"){const c=(document.getElementById("lk").value||"").trim().toUpperCase();if(c.length<4){toast("請輸入 6 碼查詢碼");return}
    rpc("xc_get",{p_code:c}).then(o=>{if(!o){toast("找不到這組查詢碼");return}reqs=reqs.filter(x=>x.code!==o.code);reqs.push(reqFromCloud(o));save();render();toast("已找到你的行程")}).catch(()=>toast("網路有問題，稍後再試"));return}
  if(act==="alogin"){const k=document.getElementById("akey").value.trim();if(!k)return;LS.set("xc-admin",k);ui.arows=null;ui.aerr=0;render();return}
  if(act==="alogout"){LS.set("xc-admin","");ui.arows=null;render();return}
  if(act==="arefresh"){ui.arows=null;render();return}
  if(act==="glmake"){const g=ui.gl;g.start=document.getElementById("gl-start").value||g.start;g.days=+document.getElementById("gl-days").value;g.name=document.getElementById("gl-name").value.trim();g.link=guestLink();render();return}
  if(act==="glcopy"){copyText(ui.gl.link,"已複製連結");return}
  if(act==="vcopy"){const r=(ui.arows||[]).find(x=>x.code===v);if(r)copyText(vendorMsg(r,b.dataset.vendor),"已複製，貼到和業者的 LINE 就好");return}
  if(act==="anote"){const t=document.getElementById("an-"+v).value.trim(),r=(ui.arows||[]).find(x=>x.code===v);rpc("xc_admin_set",{p_key:LS.get("xc-admin",""),p_code:v,p_status:r?r.status:"待確認",p_note:t}).then(()=>{if(r)r.owner_note=t;toast("已儲存，客人那邊會看到")}).catch(()=>toast("儲存失敗，請重新整理"));return}
  if(act==="swapto"){const it=plan.items.find(x=>x.uid===v);if(it){it.id=b.dataset.to;retime(it.day);save();closeModal();render();toast("已換成「"+A(it.id).name+"」")}return}
  if(act==="opt"){const s=optimize(ui.day);save();render();toast(s>0?"已依距離重排，少騎約 "+s+" 分鐘":"目前已經是最順的排法");return}
  if(act==="int"){const i=plan.interests;plan.interests=i.includes(v)?i.filter(x=>x!==v):[...i,v];save();render();return}
  if(act==="step"){const n=+v;if(n===3&&!plan.made)return;ui.step=n;render();window.scrollTo(0,0);return}
  if(act==="setdays"){plan.days=+v;if(plan.made){generate(plan);ui.day=0}save();render();return}

  if(act==="day"){ui.day=+v;render();return}
  if(act==="del"){plan.items=plan.items.filter(x=>x.uid!==v);closeModal();save();render();toast("已刪除");return}

  if(act==="share"){const url=location.href.split("#")[0]+"#/plan?d="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(plan)))));
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("已複製連結，貼給朋友就能看")).catch(()=>{prompt("複製這個連結",url)});return}
  if(act==="close"){closeModal();if(b.tagName!=="A")return;return}
  if(act==="cat"){ui.cat=v;render();return}
  if(act==="tday"){ui.tour.day=+v;render();return}
  if(act==="slot"){ui.tour.slot=+v;render();return}
  if(act==="addtour"){const t=b.dataset.slot==="整天"?"09:00":b.dataset.slot;plan.items.push({day:ui.tour.day,time:t,id:v,uid:Math.random().toString(36).slice(2,9)});retime(ui.tour.day);plan.items.sort((x,y)=>x.day-y.day||x.time.localeCompare(y.time));plan.made=true;ui.step=3;ui.day=ui.tour.day;save();toast("已加入第 "+(ui.tour.day+1)+" 天");location.hash="#/plan";return}
  if(act==="guide"){const n=+v;plan=generate({start:plan?plan.start:nextSat(),days:n,pax:plan?plan.pax:defPax(),interests:n===3?["玩水","跳島","美食"]:["玩水","美食","導覽"]});plan.made=true;ui.step=3;ui.day=0;save();location.hash="#/plan";return}
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==="astatus"){const c=t.dataset.v,r=(ui.arows||[]).find(x=>x.code===c);rpc("xc_admin_set",{p_key:LS.get("xc-admin",""),p_code:c,p_status:t.value,p_note:null}).then(()=>{if(r)r.status=t.value;toast("狀態已改成「"+t.value+"」")}).catch(()=>toast("儲存失敗，請重新整理"));return}
  if(t.id==="p-start"){plan.start=t.value||plan.start;if(plan.made){generate(plan);ui.day=0}save();render()}
});
function readForm(){}

/* ===================== 路由 ===================== */
const app=document.getElementById("app");
function render(){
  let h=location.hash||"#/";const [path,query]=h.slice(1).split("?");
  if(query&&path==="/plan"&&new URLSearchParams(query).get("in")){const q=new URLSearchParams(query),n=k=>Math.max(0,parseInt(q.get(k)||"0",10)||0);
    const px={adult:n("a"),senior:n("s"),child:n("c"),infant:n("i")};if(px.adult+px.senior<1)px.adult=1;
    plan=generate({start:/^\d{4}-\d{2}-\d{2}$/.test(q.get("in"))?q.get("in"):nextSat(),days:Math.min(7,Math.max(1,n("d")||3)),pax:px,interests:["玩水","美食"]});plan.guest=(q.get("n")||"").slice(0,20);plan.made=false;ui.step=2;ui.day=0;save();history.replaceState(null,"","#/plan");}
  if(query&&path==="/admin"){const k=new URLSearchParams(query).get("k");if(k){LS.set("xc-admin",k);ui.arows=null}history.replaceState(null,"","#/admin")}
  if(query&&path==="/plan"){const d=new URLSearchParams(query).get("d");if(d){try{plan=fixPax(JSON.parse(decodeURIComponent(escape(atob(d)))));plan.made=true;ui.step=3;save();toast("已載入朋友分享的行程")}catch(e){}}history.replaceState(null,"","#/plan");}
  const parts=path.split("/").filter(Boolean);
  const r=parts[0]||"";
  app.innerHTML=r===""?pageHome():r==="plan"?pagePlan():r==="tours"?pageTours():r==="tour"?pageTour(parts[1]):r==="mine"?pageMine():r==="line"?pageLine():r==="guide"?pageGuide():r==="local"?pageLocal():r==="admin"?pageAdmin():r==="map"?pageMap():r==="privacy"?pagePrivacy():pageHome();
  const dm=document.getElementById("daymap");if(dm){const its=dayItems(ui.day),pts=[];let n=0;its.forEach(it=>{const k=placeOf(it),pl=PLACES[k];if(pts.length&&pts.at(-1).k===k)return;pts.push({k,ll:pl.ll,home:k==="home",n:k==="home"?0:++n,label:it.time+" "+(it.id?A(it.id).name:FREE[it.free].name)+"｜"+pl.n})});DMAP=drawMap(dm,pts);if(DMAP&&ui.me&&(FOLLOW||true))setMe(ui.me);
    if(pts.length>1){const dayKey=ui.day;osrm(pts.map(p=>p.ll)).then(rt=>{if(ui.day!==dayKey||!document.body.contains(dm)||!DMAP)return;DMAP.eachLayer(l=>{if(l instanceof L.Polyline&&!(l instanceof L.Polygon)&&l.options.dashArray)l.remove()});
      L.polyline(rt.geo,{color:"#a2461f",weight:5,opacity:.85}).addTo(DMAP);const el=document.getElementById("dayroute");if(el)el.textContent=`今天沿實際道路共約 ${rMin(rt.t)} 分鐘・${rKm(rt.d)} 公里`;
      document.querySelectorAll(".mvleg").forEach(x=>{const lg=rt.legs[+x.dataset.leg];if(lg)x.textContent=`↓ ${ride()}約 ${rMin(lg.t)} 分鐘・${rKm(lg.d)} 公里`})}).catch(()=>{})}}
  drawBig(document.getElementById("bigmap"));
  const tm=document.getElementById("tourmap");if(tm&&parts[1]&&AT[parts[1]]){const k=AT[parts[1]];const tmap=drawMap(tm,k==="home"?[{ll:PLACES.home.ll,home:1,label:PLACES.home.n}]:[{ll:PLACES.home.ll,home:1,label:PLACES.home.n},{ll:PLACES[k].ll,n:"集",label:PLACES[k].n}]);if(tmap&&k!=="home"){osrm([PLACES.home.ll,PLACES[k].ll]).then(rt=>{if(!document.body.contains(tm))return;tmap.eachLayer(l=>{if(l instanceof L.Polyline&&l.options.dashArray)l.remove()});L.polyline(rt.geo,{color:"#a2461f",weight:5,opacity:.85}).addTo(tmap);tmap.fitBounds(rt.geo,{padding:[24,24]});const el=document.getElementById("tourroute");if(el)el.textContent=`從夏澄出發：沿實際道路約 ${rMin(rt.t)} 分鐘・${rKm(rt.d)} 公里`}).catch(()=>{const el=document.getElementById("tourroute");if(el)el.textContent=""})}}
  app.classList.toggle("has-dock",!!document.querySelector(".dockbar"));document.body.classList.toggle("dock",!!document.querySelector(".dockbar"));
  navs(path);document.title=({"":"夏澄｜澎湖玩法與行程",plan:"排行程｜夏澄",tours:"在地玩法｜夏澄",mine:"送出紀錄｜夏澄",map:"澎湖地圖｜夏澄",privacy:"隱私權與服務說明｜夏澄",admin:"後台｜夏澄"})[r]||"夏澄";
}
let lastPath="";
window.addEventListener("hashchange",()=>{const p=location.hash.split("?")[0];render();if(p!==lastPath)window.scrollTo(0,0);lastPath=p});
lastPath=location.hash.split("?")[0];render();loadSheet();loadWx();
window.addEventListener("afterprint",()=>document.body.classList.remove("printing"));
</script>
